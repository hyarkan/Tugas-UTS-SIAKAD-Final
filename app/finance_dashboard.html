<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Keuangan SPP | Minggu 11</title><style>body{font-family:system-ui,sans-serif;max-width:1100px;margin:auto;padding:25px;background:#f5f7fb;color:#20304a}h1{font-size:1.8rem}.card{background:white;border-radius:12px;padding:18px;margin:16px 0;box-shadow:0 2px 10px #182b4a12}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #eee}input,button{padding:10px;border-radius:7px;border:1px solid #bbb}button{background:#285fbc;color:white;cursor:pointer}.bar{background:#356ac1;color:white;margin:7px 0;padding:9px;border-radius:5px;min-width:35px}.hint{color:#67748c}</style></head><body><h1>Dashboard Keuangan SPP</h1><p class="hint">Simulasi Minggu 11 • data dibaca langsung dari database melalui API • pembaruan otomatis setiap 15 detik</p><div class="card"><label>Kunci admin demo <input type="password" id="key" placeholder="Masukkan FINANCE_ADMIN_KEY"></label> <button onclick="load()">Muat dashboard</button><p id="status"></p></div><div class="card"><h2>Per Mahasiswa</h2><table><thead><tr><th>NIM</th><th>Total tagihan</th><th>Sudah bayar</th><th>Sisa</th></tr></thead><tbody id="students"></tbody></table></div><div class="card"><h2>Collection Rate per Program Studi</h2><table><thead><tr><th>Program Studi</th><th>Tagihan lunas</th><th>Total tagihan</th><th>Persentase</th></tr></thead><tbody id="programs"></tbody></table></div><div class="card"><h2>Grafik Pembayaran Bulanan</h2><div id="chart"></div></div><script>const rp=x=>'Rp '+Number(x).toLocaleString('id-ID');async function load(){let k=document.getElementById('key').value; if(!k)return;let res=await fetch('/api/finance/dashboard',{headers:{'X-Demo-Admin-Key':k}});if(!res.ok){document.getElementById('status').textContent='Gagal: HTTP '+res.status;return}let d=await res.json();document.getElementById('status').textContent='Data berhasil diperbarui '+new Date().toLocaleTimeString('id-ID');const cell=(v)=>{let td=document.createElement('td');td.textContent=v;return td};let body=document.getElementById('students');body.replaceChildren();for(let s of d.students){let tr=document.createElement('tr');for(let v of [s.nim,rp(s.total),rp(s.paid),rp(s.remaining)])tr.append(cell(v));body.append(tr)}body=document.getElementById('programs');body.replaceChildren();for(let p of d.programs){let tr=document.createElement('tr');for(let v of [p.program_studi,p.paid_bills,p.bills,p.collection_rate_percent+'%'])tr.append(cell(v));body.append(tr)}let chart=document.getElementById('chart');chart.replaceChildren();let max=Math.max(1,...d.monthly_payments.map(x=>Number(x.amount)));for(let p of d.monthly_payments){let t=document.createElement('div');t.textContent=p.month+' • '+rp(p.amount);let bar=document.createElement('div');bar.className='bar';bar.style.width=Math.max(8,Number(p.amount)/max*85)+'%';bar.append(t);chart.append(bar)}if(!d.monthly_payments.length)chart.textContent='Belum ada pembayaran.'}setInterval(()=>{if(document.getElementById('key').value)load()},15000);</script></body></html>
